[pytest]
pythonpath = .
testpaths = tests
markers =
    live: optional test that requires a configured live Pi model and API key
    market_live: optional test that requires network access to AKShare
    kronos_live: optional test that requires an installed Kronos model
    fundamental_data_live: optional test that requires network access to AKShare fundamental data
    research_search_live: optional test that requires a configured Tavily API key
